# Release workflow (stable) — builds native binaries for each platform and
# publishes per-platform npm sub-packages (nuwax-upload-<platform>, each
# embedding its binary), then the lightweight main package (nuwax-upload).
# All packages get the default `latest` dist-tag.
#
# Binaries live INSIDE the npm packages — installation never touches GitHub,
# so users behind slow GitHub access (e.g. mainland China) install purely via
# the npm registry / npmmirror.
#
# Trigger: push a STABLE tag like v0.1.3 (no "-" pre-release separator).
# Pre-release tags (e.g. v0.1.4-beta.1) are routed to release-beta.yml by the
# job-level `if` (the tag glob pattern cannot distinguish them on its own).

name: Release (stable)

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable version tag (e.g. v0.1.3) — must NOT contain "-"'
        required: true

permissions:
  contents: write   # for `gh release create`

jobs:
  # ---- Job 1: build each platform + publish its npm sub-package (parallel) ----
  build-and-publish-platform:
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    name: build (${{ matrix.sub }})
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-22.04, sub: linux-x64,    npm_os: linux,  npm_cpu: x64,   bin: nuwax-upload }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, sub: linux-arm64, npm_os: linux, npm_cpu: arm64, bin: nuwax-upload }
          - { target: x86_64-apple-darwin,       runner: macos-13,     sub: darwin-x64,   npm_os: darwin, npm_cpu: x64,   bin: nuwax-upload }
          - { target: aarch64-apple-darwin,      runner: macos-14,     sub: darwin-arm64, npm_os: darwin, npm_cpu: arm64, bin: nuwax-upload }
          - { target: x86_64-pc-windows-msvc,    runner: windows-2022, sub: win32-x64,    npm_os: win32,  npm_cpu: x64,   bin: nuwax-upload.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p pkg
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "pkg/${{ matrix.bin }}"
          # Non-Windows binaries need the executable bit; npm publish preserves it.
          case "${{ matrix.bin }}" in
            *.exe) ;;
            *) chmod +x "pkg/${{ matrix.bin }}" ;;
          esac

      - name: Generate sub-package.json
        shell: bash
        env:
          SUB: ${{ matrix.sub }}
          NPM_OS: ${{ matrix.npm_os }}
          NPM_CPU: ${{ matrix.npm_cpu }}
          BIN: ${{ matrix.bin }}
        run: |
          VERSION="${TAG#v}"
          VERSION="$VERSION" SUB="$SUB" NPM_OS="$NPM_OS" NPM_CPU="$NPM_CPU" BIN="$BIN" node npm/build-package.mjs sub

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish sub-package (@latest)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public pkg/

      - name: Upload binary artifact (for GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.sub }}
          path: pkg/${{ matrix.bin }}
          if-no-files-found: error

  # ---- Job 2: publish the main package after all sub-packages exist ----
  publish-main:
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    name: publish main package (@latest)
    needs: build-and-publish-platform
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Stage shim + generate package.json
        run: |
          mkdir -p pkg
          cp npm/shim.mjs pkg/shim.mjs
          VERSION="${TAG#v}" node npm/build-package.mjs main

      - name: Publish main package (@latest)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public pkg/

  # ---- Job 3 (fallback): attach binaries to a GitHub Release ----
  # Lets non-npm users (docker, direct download) grab binaries too.
  github-release:
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    name: GitHub Release (stable)
    needs: build-and-publish-platform
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bins
          # keep each platform in its own dir (bin-<sub>)

      - name: Package archives + checksums
        shell: bash
        run: |
          mkdir -p release
          for d in bins/bin-*/; do
            sub=$(basename "$d" | sed 's/^bin-//')
            if [[ "$sub" == win32-* ]]; then
              ( cd "$d" && zip -q "../../release/nuwax-upload-${sub}.zip" . )
            else
              tar -czf "release/nuwax-upload-${sub}.tar.gz" -C "$d" .
            fi
          done
          ( cd release && sha256sum * > checksums.sha256 )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            release/*
